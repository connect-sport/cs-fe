name: Deploy Next.js (cs-fe)

on:
  push:
    branches: [develop] # hoặc main nếu bạn muốn

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ # hoặc ./cs-fe nếu bạn tách frontend vào folder riêng
          file: ./Dockerfile
          push: true
          tags: nxhoang189/cs-fe:latest

  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull nxhoang189/cs-fe:latest
            docker stop cs-fe || true && docker rm cs-fe || true
            docker run -d -p 80:3000 --name cs-fe nxhoang189/cs-fe:latest
